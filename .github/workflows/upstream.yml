name: Sync & Build Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

env:
  REPO: omaj/kapowarr

permissions:
  contents: write

jobs:
  sync:
    name: Sync Upstream
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
    steps:
      - name: Checkout Development Branch
        uses: actions/checkout@v6
        with:
          ref: development
          fetch-depth: 0

      - name: Sync Upstream
        id: sync
        run: |
          git remote add upstream https://github.com/Casvt/Kapowarr.git
          git fetch upstream development

          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/development)

          if [ "$LOCAL" != "$REMOTE" ]; then
            git reset --hard $REMOTE
            git push --force origin HEAD:development
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build & Push
    needs: sync
    if: needs.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: development
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Upstream
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: ${{ env.REPO }}:upstream
          cache-from: type=gha,scope=upstream
          cache-to: type=gha,mode=max,scope=upstream
